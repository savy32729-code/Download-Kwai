<!doctype html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>Kwai Video Downloader</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main class="wrap">
  <section class="card">
    <div class="logo">K</div>
    <h1>Kwai Video Downloader</h1>
    <p class="sub">ទាញយកវីដេអូ Kwai ដែលអ្នកមានសិទ្ធិទាញយក</p>

    <form id="form">
      <label for="url">Kwai Video Link</label>
      <div class="input-row">
        <input id="url" name="url" type="url" placeholder="Paste Kwai link here..." required>
        <button type="button" id="paste">Paste</button>
      </div>
      <button class="download" type="submit">⬇️ Download Video</button>
    </form>

    <div id="status" class="status"></div>
    <a id="result" class="result" target="_blank" rel="noopener">⬇️ Save Video</a>

    <p class="note">ប្រើសម្រាប់វីដេអូដែលអ្នកមានសិទ្ធិទាញយក។</p>
  </section>
</main>
<script src="/static/app.js"></script>
</body>
</html>
